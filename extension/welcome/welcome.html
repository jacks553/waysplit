<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="welcome.title">Waysplit</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="../lib/common.css">
  <link rel="stylesheet" href="welcome.css">
  <script type="module" src="welcome.js"></script>
</head>
<!-- Надписей в разметке нет: data-i18n="ключ" — текст элемента, сами тексты — в словарях
     lib/i18n/ (их подставляет lib/i18n.js). Вложенный элемент с data-slot="имя" остаётся в тексте
     на месте {имя}. -->
<body>
  <main class="wrap">
    <header class="hero">
      <img src="../icons/icon128.png" alt="" width="80" height="80">
      <div>
        <h1 data-i18n="welcome.title"></h1>
        <p class="name-note" data-i18n="welcome.nameNote"></p>
        <p data-i18n="welcome.intro"></p>
      </div>
      <button class="lang-btn" id="langBtn" type="button"></button>
    </header>

    <ol class="steps">
      <li class="step" id="step1" data-done="false">
        <div class="mark" aria-hidden="true">1</div>
        <div class="body">
          <h2 data-i18n="welcome.s1.title"></h2>
          <p data-i18n="welcome.s1.text"></p>
          <p class="state" id="hostState" data-i18n="welcome.checking"></p>
          <div class="howto" id="howto" hidden>
            <ol class="install" id="installSteps"></ol>
            <div class="row">
              <a class="btn" id="download" href="#" target="_blank" rel="noopener" data-i18n="common.download"></a>
              <a class="release-link" id="releasePage" href="#" target="_blank" rel="noopener" data-i18n="welcome.releasePage"></a>
            </div>
            <p class="note" data-i18n="welcome.s1.note"></p>
          </div>
          <button class="ghost" id="recheck" type="button" data-i18n="welcome.recheck"></button>
        </div>
      </li>

      <li class="step" id="step2" data-done="false">
        <div class="mark" aria-hidden="true">2</div>
        <div class="body">
          <h2 data-i18n="welcome.s2.title"></h2>
          <p data-i18n="welcome.s2.text"><code data-slot="vless">vless://…</code><code data-slot="hy2">hysteria2://…</code><code data-slot="sub">https://…</code></p>
          <textarea id="links" rows="3" spellcheck="false" placeholder="vless://…"></textarea>
          <div class="row">
            <button class="btn" id="addBtn" type="button" data-i18n="common.add"></button>
            <p class="add-result" id="addResult" hidden></p>
          </div>
          <label class="option"><input type="checkbox" id="ruDirect">
            <span><b data-i18n="ru.title"></b><span class="option-sub" data-i18n="ru.sub"></span></span></label>
        </div>
      </li>

      <li class="step" id="step3" data-done="false">
        <div class="mark" aria-hidden="true">3</div>
        <div class="body">
          <h2 data-i18n="welcome.s3.title"></h2>
          <p data-i18n="welcome.s3.text"></p>
          <div class="row">
            <button class="btn" id="enable" type="button" data-i18n="home.power.turnOn"></button>
            <p class="state" id="vpnState"></p>
          </div>
        </div>
      </li>
    </ol>

    <p class="foot" data-i18n="welcome.foot"><a href="../popup/popup.html?full#rules" data-slot="open" data-i18n="welcome.foot.open"></a></p>
  </main>
<div class="pop" id="pop" popover="auto" role="menu"></div>
</body>
</html>
