<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waysplit</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="../lib/common.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<!-- Окно расширения (SPEC-POPUP.md): вкладки внизу, вложенные экраны поверх вкладки. Та же
     страница открывается и на всю вкладку браузера (?full — «Развернуть», страница настроек).
     Надписей в разметке нет: data-i18n="ключ" — текст элемента, data-i18n-title, -aria-label,
     -placeholder — его атрибуты; сами тексты — в словарях lib/i18n/ (их подставляет lib/i18n.js).
     Вложенный элемент с data-slot="имя" остаётся в тексте на месте {имя}. -->
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <img class="logo" src="../icons/icon48.png" alt="" width="24" height="24">
    <span class="brand">Waysplit</span>
    <button class="icon-btn lang-btn" id="langBtn" type="button"></button>
    <button class="icon-btn" id="helpBtn" type="button" data-i18n-aria-label="top.help" aria-haspopup="menu" data-i18n-title="top.help"></button>
    <button class="icon-btn" id="expandBtn" type="button" data-i18n-aria-label="top.expand" data-i18n-title="top.expand"></button>
  </header>

  <main class="content" id="content">
    <!-- Главная -->
    <section class="panel" id="panel-home" role="tabpanel" aria-labelledby="tab-home">
      <div class="conflict" id="conflict" role="alert" hidden>
        <strong data-i18n="home.conflict.title"></strong>
        <span data-i18n="home.conflict.text"></span>
      </div>
      <div class="conflict" id="webrtcWarn" role="alert" hidden>
        <strong data-i18n="home.webrtc.title"></strong>
        <span data-i18n="home.webrtc.text"></span>
      </div>

      <section class="power-block">
        <button class="power" id="power" type="button" aria-pressed="false" data-state="off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v8"/><path d="M6.6 6.9a7.6 7.6 0 1 0 10.8 0"/></svg>
        </button>
        <p class="power-label" data-i18n="home.powerLabel"></p>
        <p class="status" id="status" aria-live="polite" data-i18n="home.status.off"></p>
        <p class="detail" id="detail"></p>
      </section>

      <div class="problem" id="problem" hidden>
        <p class="problem-text" id="problemText"></p>
        <p class="hint" id="hint" hidden></p>
        <button class="link small-link" id="problemGo" type="button" hidden></button>
        <ol class="steps" id="steps" hidden></ol>
        <div class="download-row" id="downloadRow" hidden>
          <a class="btn btn-small" id="download" href="#" target="_blank" rel="noopener" data-i18n="common.download"></a>
          <a class="release-link" id="releasePage" href="#" target="_blank" rel="noopener" data-i18n="home.releasePage"></a>
        </div>
      </div>

      <button class="card row-card" id="serverRow" type="button" hidden>
        <span class="flag" id="srvFlag"></span>
        <span class="row-main">
          <span class="row-label" id="srvLabel" data-i18n="home.server"></span>
          <span class="row-name" id="srvName"></span>
        </span>
        <span id="srvBars"></span>
        <span class="chev" aria-hidden="true"></span>
      </button>

      <button class="card ru-row" id="ruSwitch" type="button" role="switch" aria-checked="false" hidden>
        <span class="switch" aria-hidden="true"></span>
        <span class="ru-text">
          <span class="ru-title" data-i18n="ru.title"></span>
          <span class="ru-sub" data-i18n="ru.sub"></span>
        </span>
      </button>

      <section class="card perm-card" id="permHome" hidden></section>

      <section class="card site" id="site" hidden>
        <span class="row-label" data-i18n="home.thisSite"></span>
        <div class="reload" id="siteNew" role="status" hidden>
          <span id="siteNewText" data-i18n="home.siteNew"></span>
          <button class="btn btn-small" id="siteNewReload" type="button" data-i18n="common.reloadTab"></button>
        </div>
        <div class="site-main">
          <span class="favicon" id="siteIcon" aria-hidden="true"></span>
          <select class="site-domain" id="siteDomain" data-i18n-aria-label="home.siteDomain.aria"></select>
        </div>
        <p class="site-why" id="siteWhy"></p>
        <div class="site-warn" id="siteWarn" hidden>
          <span id="siteWarnText"></span>
          <button class="btn btn-small" id="siteWarnFix" type="button" data-i18n="home.warn.enableRules"></button>
        </div>
        <div class="site-controls" id="siteControls">
          <button class="switch-row" id="siteSwitch" type="button" role="switch" aria-checked="false">
            <span class="switch" aria-hidden="true"></span>
            <span id="siteSwitchText" data-i18n="action.direct"></span>
          </button>
          <button class="flag-btn" id="siteServer" type="button" data-i18n-aria-label="home.siteServer" data-i18n-title="home.siteServer">
            <span class="flag" id="siteFlag"></span>
            <span class="chev small" aria-hidden="true"></span>
          </button>
        </div>
        <div class="site-links">
          <button class="link small-link" id="ruleRemove" type="button" hidden data-i18n="home.ruleRemove"></button>
          <button class="link small-link" id="tdButton" type="button" aria-expanded="false" data-i18n="home.tabDomains"></button>
        </div>
        <div class="td" id="td" hidden>
          <p class="td-note" id="tdNote"></p>
          <ul class="td-list" id="tdList"></ul>
          <div class="td-actions" id="tdActions" hidden>
            <select class="select-small" id="tdAction" data-i18n-aria-label="home.td.action.aria"></select>
            <button class="btn btn-small" id="tdAdd" type="button" data-i18n="home.td.add"></button>
          </div>
        </div>
        <div class="reload" id="reload" hidden>
          <span data-i18n="home.ruleSaved"></span>
          <button class="btn btn-small" id="reloadTab" type="button" data-i18n="common.reloadTab"></button>
        </div>
      </section>

      <form class="card add-card" id="homeAdd" hidden>
        <label class="row-label" for="homeLinks" data-i18n="home.add.label"></label>
        <textarea id="homeLinks" rows="3" spellcheck="false" data-i18n-placeholder="common.linksPlaceholder"></textarea>
        <button class="btn" id="homeAddBtn" type="submit" data-i18n="common.add"></button>
        <p class="add-result" id="homeAddResult" hidden></p>
      </form>
    </section>

    <!-- Серверы -->
    <section class="panel" id="panel-servers" role="tabpanel" aria-labelledby="tab-servers" hidden>
      <div class="panel-head">
        <h2><span data-i18n="servers.title"></span> <span class="count" id="srvCount"></span></h2>
        <button class="btn btn-small" id="srvAdd" type="button" data-i18n="servers.add"></button>
      </div>
      <input class="search" id="srvSearch" type="search" data-i18n-placeholder="servers.search" autocomplete="off">
      <div class="tools">
        <button class="ghost" id="pingAll" type="button" data-i18n="servers.pingAll"></button>
        <button class="ghost" id="fastest" type="button" data-i18n="servers.fastest"></button>
      </div>
      <div id="srvGroups"></div>
      <p class="empty" id="srvEmpty" hidden data-i18n="servers.empty"></p>
      <p class="hint" id="srvHint" data-i18n="servers.hint"></p>
    </section>

    <!-- Правила -->
    <section class="panel" id="panel-rules" role="tabpanel" aria-labelledby="tab-rules" hidden>
      <div class="panel-head">
        <h2><span data-i18n="rules.title"></span> <span class="count" id="rulesCount"></span></h2>
        <button class="icon-btn" id="rulesMore" type="button" data-i18n-aria-label="rules.more.aria" aria-haspopup="menu" data-i18n-title="common.more"></button>
      </div>
      <p class="rules-ru" id="rulesRu" hidden data-i18n="rules.ruOn"></p>
      <form class="rule-add" id="ruleForm">
        <textarea class="search rule-input" id="ruleInput" rows="1" spellcheck="false" data-i18n-placeholder="rules.input.placeholder" data-i18n-aria-label="rules.input.aria"></textarea>
        <select class="select-small" id="ruleAction" data-i18n-aria-label="rules.action.aria"></select>
        <button class="btn plus" type="submit" data-i18n-aria-label="rules.addRule" data-i18n-title="rules.addRule">+</button>
      </form>
      <p class="rules-off" id="rulesOff" hidden></p>
      <section class="card perm-card" id="permRules" hidden></section>
      <ul class="rules" id="rulesList"></ul>
      <div class="empty-box" id="rulesEmpty" hidden>
        <p data-i18n="rules.empty.p1"><b data-slot="title" data-i18n="rules.empty.title"></b></p>
        <p data-i18n="rules.empty.p2"><code data-slot="domain">example.com</code></p>
      </div>
      <p class="hint" id="rulesHint" data-i18n="rules.hint"></p>
    </section>

    <!-- Настройки -->
    <section class="panel" id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <div class="panel-head"><h2 data-i18n="tabs.settings"></h2></div>

      <fieldset class="group">
        <legend data-i18n="settings.onFailure.legend"></legend>
        <label class="check"><input type="radio" name="onFailure" value="block">
          <span class="opt"><span class="opt-name" data-i18n="settings.onFailure.block"></span>
            <span class="opt-note" data-i18n="settings.onFailure.block.note"></span></span></label>
        <label class="check"><input type="radio" name="onFailure" value="direct">
          <span class="opt"><span class="opt-name" data-i18n="settings.onFailure.direct"></span>
            <span class="opt-note" data-i18n="settings.onFailure.direct.note"></span></span></label>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="rules.title"></legend>
        <label class="check"><input type="checkbox" id="setRulesWhenOff">
          <span class="opt"><span class="opt-name" data-i18n="settings.rulesWhenOff"></span>
            <span class="opt-note" data-i18n="settings.rulesWhenOff.note"></span></span></label>
        <label class="check"><input type="checkbox" id="setRuDirect">
          <span class="opt"><span class="opt-name" data-i18n="ru.title"></span>
            <span class="opt-note" data-i18n="settings.ru.note"></span></span></label>
        <label class="check"><input type="checkbox" id="autoSiteDomains">
          <span class="opt"><span class="opt-name" data-i18n="settings.autoSite"></span>
            <span class="opt-note" data-i18n="settings.autoSite.note"></span></span></label>
        <div class="site-warn" id="autoSitePerm" hidden>
          <span data-i18n="settings.autoSite.perm"></span>
          <button class="btn btn-small" id="autoSitePermBtn" type="button" data-i18n="common.allow"></button>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="settings.protect.legend"></legend>
        <label class="check"><input type="checkbox" id="webrtcProtection">
          <span class="opt"><span class="opt-name" data-i18n="settings.webrtc"></span>
            <span class="opt-note" data-i18n="settings.webrtc.note"></span></span></label>
        <label class="field"><span data-i18n="settings.autoConnect"></span>
          <select class="select-small" id="autoConnect">
            <option value="restore" data-i18n="settings.autoConnect.restore"></option>
            <option value="off" data-i18n="settings.autoConnect.off"></option>
          </select></label>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="settings.subs.legend"></legend>
        <label class="field"><span data-i18n="settings.subs.ua"></span>
          <input class="search" id="subscriptionUA" type="text" spellcheck="false" maxlength="200"></label>
        <label class="field"><span data-i18n="settings.subs.interval"></span>
          <input class="search narrow" id="subscriptionIntervalHours" type="number" min="1" max="168" step="1"></label>
        <p class="hint" data-i18n="settings.subs.hint"></p>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="settings.advanced.legend"></legend>
        <label class="field"><span data-i18n="settings.ports"><span class="hint" id="portRangeEnd" data-slot="end"></span></span>
          <input class="search narrow" id="portRangeStart" type="number" min="1024" max="65337" step="1"></label>
        <label class="field"><span data-i18n="settings.logLevel"></span>
          <select class="select-small" id="logLevel">
            <option value="error" data-i18n="settings.logLevel.error"></option>
            <option value="warn" data-i18n="settings.logLevel.warn"></option>
            <option value="info" data-i18n="settings.logLevel.info"></option>
            <option value="debug" data-i18n="settings.logLevel.debug"></option>
            <option value="trace" data-i18n="settings.logLevel.trace"></option>
          </select></label>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="settings.look.legend"></legend>
        <label class="field"><span data-i18n="settings.theme"></span>
          <select class="select-small" id="theme">
            <option value="system" data-i18n="settings.theme.system"></option>
            <option value="light" data-i18n="settings.theme.light"></option>
            <option value="dark" data-i18n="settings.theme.dark"></option>
          </select></label>
        <!-- Язык окна: «как в Chrome» и языки из словарей (их названия подставляет settings.js). -->
        <label class="field"><span data-i18n="settings.language"></span>
          <select class="select-small" id="language"></select></label>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="settings.backup.legend"></legend>
        <p class="hint" data-i18n="settings.backup.hint"><b data-slot="secrets" data-i18n="settings.backup.hint.secrets"></b></p>
        <div class="tools">
          <button class="ghost" id="exportBackup" type="button" data-i18n="settings.backup.save"></button>
          <button class="ghost" id="importBackup" type="button" data-i18n="settings.backup.restore"></button>
        </div>
      </fieldset>

      <div class="card list-card">
        <button class="list-row" id="openDiag" type="button"><span data-i18n="settings.diag"></span><span class="chev" aria-hidden="true"></span></button>
        <a class="list-row" id="helpLink" target="_blank" rel="noopener"><span data-i18n="top.help"></span><span class="ext" aria-hidden="true"></span></a>
        <a class="list-row" id="issuesLink" target="_blank" rel="noopener"><span data-i18n="top.report"></span><span class="ext" aria-hidden="true"></span></a>
      </div>
      <p class="versions" id="versions"></p>
      <p class="versions" id="hostLang" hidden><a id="hostLangLink" target="_blank" rel="noopener"></a></p>
    </section>
  </main>

  <div class="screens" id="screens"></div>

  <nav class="tabbar" role="tablist" data-i18n-aria-label="tabs.aria">
    <button class="tab" id="tab-home" role="tab" type="button" data-tab="home" aria-controls="panel-home"><span class="tab-icon"></span><span data-i18n="tabs.home"></span></button>
    <button class="tab" id="tab-servers" role="tab" type="button" data-tab="servers" aria-controls="panel-servers"><span class="tab-icon"></span><span data-i18n="tabs.servers"></span></button>
    <button class="tab" id="tab-rules" role="tab" type="button" data-tab="rules" aria-controls="panel-rules"><span class="tab-icon"></span><span data-i18n="tabs.rules"></span></button>
    <button class="tab" id="tab-settings" role="tab" type="button" data-tab="settings" aria-controls="panel-settings"><span class="tab-icon"></span><span data-i18n="tabs.settings"></span></button>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
</div>

<div class="pop" id="pop" popover="auto" role="menu"></div>
<dialog class="dlg" id="dlg">
  <form method="dialog" class="dlg-form">
    <p class="dlg-title" id="dlgTitle"></p>
    <p class="dlg-text" id="dlgText"></p>
    <input class="search" id="dlgInput" type="text" maxlength="100" hidden>
    <div class="dlg-buttons">
      <button class="ghost" value="cancel" type="submit" data-i18n="common.cancel"></button>
      <button class="btn" value="ok" type="submit" id="dlgOk" data-i18n="common.ok"></button>
    </div>
  </form>
</dialog>
</body>
</html>
